# Partitions of the virtual Android disk (GPT), in order.
# Format: <name> <image file in images_dir | blank:SIZE> [rw] [min=SIZE] [ifmissing=blank:SIZE]
# Sparse images are expanded once into the cache folder (writable).
#
# Layout modelled on Cuttlefish's "os_composite" disk
# (device/google/cuttlefish/host/commands/assemble_cvd/disk_flags.cpp).
# Check the fstab in your build's vendor ramdisk if a partition is reported
# missing during first-stage init, and adjust names here.
#
# vbmeta_a uses "disable-verification" (like fastboot --disable-verification)
# because the chained vbmeta_system / vbmeta_vendor_dlkm / vbmeta_system_dlkm
# images are not present. If you add the real ones from the Cuttlefish image
# zip, you can remove that option.

misc                  blank:1M
frp                   blank:1M
boot_a                boot.img
boot_b                blank:64M
init_boot_a           init_boot.img
init_boot_b           blank:8M
vendor_boot_a         vendor_boot.img
vendor_boot_b         blank:64M
vbmeta_a              vbmeta.img                disable-verification
vbmeta_b              blank:64K
vbmeta_system_a       vbmeta_system.img         ifmissing=blank:64K
vbmeta_system_b       blank:64K
vbmeta_vendor_dlkm_a  vbmeta_vendor_dlkm.img    ifmissing=blank:64K
vbmeta_vendor_dlkm_b  blank:64K
vbmeta_system_dlkm_a  vbmeta_system_dlkm.img    ifmissing=blank:64K
vbmeta_system_dlkm_b  blank:64K
super                 super.img
userdata              userdata.img              rw min=8G
metadata              blank:64M
