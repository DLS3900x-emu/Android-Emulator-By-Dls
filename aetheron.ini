# Aetheron settings. Paths are relative to this file's folder.

# Folder with the Android 16 Cuttlefish images (boot.img, init_boot.img,
# vendor_boot.img, super.img, userdata.img, vbmeta*.img).
images_dir = android16_ci\images

# Where expanded (unsparsed) images and blank partitions are kept.
# Needs free space roughly the size of super.img expanded + userdata (~16 GB).
cache_dir = C:\AetheronCache

disk_config = config\aetheron_disk.cfg
bootconfig_file = config\aetheron_bootconfig.txt

ram_mb = 4096
# CPU cores for Android. More than 1 is experimental: if Android stops booting, set 1.
cpus = 4
display_width = 1280
display_height = 720
display_dpi = 160

# Internet for the guest through a built-in NAT (on/off).
network = on

# Appended to the kernel command line from boot.img + vendor_boot.img.
cmdline_extra = console=ttyS0,115200 earlycon=uart8250,io,0x3f8,115200 8250.nr_uarts=1

# Clean boot screen with a progress bar until Android is ready (on/off).
boot_splash = on

# Run config\aetheron_setup.sh inside Android once after boot: hides every app
# except Settings / Play Store and applies the clean look (on/off).
first_boot_setup = on

# adb access from Windows (adb connect 127.0.0.1:6520). Off by default.
adb_bridge = off

# Install Aetheron's own home screen (apps\AetheronLauncher.apk) and make it
# the default. off removes it again.
custom_launcher = on
